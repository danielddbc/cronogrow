<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0D1F0E" />
  <meta name="description" content="CronoGrow — Seu cultivo organizado no tempo." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CronoGrow" />

  <title>CronoGrow</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body data-theme="escuro">

  <!-- ── Tela de loading ──────────────────────────────── -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-logo">
      <img src="assets/logo/simbolo.png" alt="CronoGrow" width="64" height="64" class="logo-girando" />
      <span class="loading-nome">CronoGrow</span>
    </div>
    <div class="loading-spinner"></div>
  </div>

  <!-- ── Login ─────────────────────────────────────────── -->
  <div id="tela-login" class="tela-login hidden">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/logo/logo-completa.png" alt="CronoGrow" class="login-logo-img" />
        <p>Seu cultivo organizado no tempo</p>
      </div>
      <div id="login-form" class="login-form">
        <h2 id="login-titulo">Entrar</h2>
        <div class="campo" id="campo-nome" style="display:none">
          <label>Seu nome</label>
          <input type="text" id="inp-nome" placeholder="Como quer ser chamado?" autocomplete="name" />
        </div>
        <div class="campo">
          <label>Senha</label>
          <input type="password" id="inp-senha" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary btn-full" id="btn-entrar">Entrar</button>
        <p class="login-msg" id="login-erro"></p>
      </div>
    </div>
  </div>

  <!-- ── App principal ──────────────────────────────────── -->
  <div id="app" class="app hidden">

    <!-- Navbar lateral (desktop) / bottom (mobile) -->
    <nav class="navbar" id="navbar">
      <div class="navbar-logo">
        <img src="assets/logo/simbolo.png" alt="CronoGrow" width="28" height="28" />
        <span class="navbar-nome">CronoGrow</span>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="#dashboard"  class="nav-link" data-page="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Início</span></a></li>
        <li><a href="#plantas"    class="nav-link" data-page="plantas">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12c0-2.76 1.12-5.26 2.93-7.07"/><path d="M12 6v6l4 2"/></svg>
          <span>Plantas</span></a></li>
        <li><a href="#timeline"   class="nav-link" data-page="timeline">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>Timeline</span></a></li>
        <li><a href="#tarefas"    class="nav-link" data-page="tarefas">
          <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Tarefas</span></a></li>
        <li><a href="#diario"     class="nav-link" data-page="diario">
          <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>Diário</span></a></li>
        <li><a href="#galeria"    class="nav-link" data-page="galeria">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Galeria</span></a></li>
        <li><a href="#relatorios" class="nav-link" data-page="relatorios">
          <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Relatórios</span></a></li>
        <li><a href="#config"     class="nav-link" data-page="config">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Config</span></a></li>
      </ul>
      <div class="navbar-footer">
        <button class="btn-logout" id="btn-logout" title="Sair">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="main-content" id="main-content">
      <!-- As páginas são injetadas aqui pelo router -->
    </main>

    <!-- FAB (botão flutuante de ação) -->
    <button class="fab" id="fab" title="Nova ação" style="display:none">
      <svg viewBox="0 0 24 24" width="24" height="24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

  </div>

  <!-- ── Modal global ───────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-titulo"></h3>
        <button class="modal-fechar" id="modal-fechar">
          <svg viewBox="0 0 24 24" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ── Toast de notificação ───────────────────────────── -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ── Scripts ───────────────────────────────────────── -->
  <script src="js/services/api.js"></script>
  <script src="js/services/storage.js"></script>
  <script src="js/services/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
